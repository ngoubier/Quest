# Publication du jeu sur GitHub Pages, à chaque mise à jour de main.
# Le jeu est fait de fichiers statiques (HTML + modules JavaScript) : rien à construire.
# On lance d'abord les tests ; s'ils échouent, rien n'est publié.
name: Publier le jeu

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tests
        run: node --test tests/*.test.js
      - name: Fichiers du site
        run: |
          mkdir _site
          cp -r index.html game gameplay engine content demos _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v4
